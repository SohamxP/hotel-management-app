services:
  postgres:
    image: postgres:17-alpine
    container_name: hotel-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_management

    ports:
      - "5433:5432"

    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hotel_user -d hotel_management",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hotel-management-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: development
      PORT: 5001

      DATABASE_URL: postgresql://hotel_user:hotel_password@postgres:5432/hotel_management?schema=public

      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

    ports:
      - "5001:5001"

volumes:
  hotel_postgres_data: